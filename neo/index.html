<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neo'yu Bul</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Neo'yu Bul: Matrix kalabaliginda yesil gozluklu SAP'ciyi bul.
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const rain = document.createElement('canvas'), rc = rain.getContext('2d');
const FONT = '"Courier New", monospace';
let W = 0, H = 0, state = 'menu';

// --- yagmur ---
const CH = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホ0123456789SELECTLOOPENDABAPCOMMIT';
const WORDS = ['SELECT * FROM mara', 'LOOP AT itab.', 'ENDLOOP.', 'COMMIT WORK.', 'SY-SUBRC = 4', 'ST22 DUMP', 'SE38', 'BAPI_PO_CREATE1', 'READ TABLE', 'MODIFY ztab.'];
let cols = [], FS = 16;
function initRain() {
  FS = W < 500 ? 13 : 16;
  cols = Array.from({ length: Math.ceil(W / FS) }, () => Math.random() * -H / FS);
  rc.fillStyle = '#000'; rc.fillRect(0, 0, W, H);
}
function stepRain(speed) {
  rc.fillStyle = 'rgba(0,0,0,0.09)'; rc.fillRect(0, 0, W, H);
  rc.font = FS + 'px monospace';
  for (let i = 0; i < cols.length; i++) {
    const y = cols[i] * FS;
    if (y > 0) {
      rc.fillStyle = Math.random() < .1 ? '#cfc' : '#0f4';
      rc.fillText(CH[Math.random() * CH.length | 0], i * FS, y);
    }
    cols[i] += speed;
    if (y > H && Math.random() > .975) cols[i] = 0;
  }
  if (Math.random() < .015) {
    rc.fillStyle = 'rgba(0,255,70,.4)';
    rc.fillText(WORDS[Math.random() * WORDS.length | 0], Math.random() * W * .8, Math.random() * H);
  }
}

// --- karakterler ---
const F = {
  hair: ['kivircik', 'kivircikKisa', 'kel', 'duz', 'uzun'],
  glas: ['yesil', 'normal', 'gunes', 'yok'],
  beard: ['keci', 'yok', 'tam', 'biyik'],
  top: ['mavi', 'takim', 'gri', 'yesil'],
};
const TARGET = { hair: 'kivircik', glas: 'yesil', beard: 'keci', top: 'mavi', hc: '#3a2a1e', skin: '#d9a982', target: true };
const HC = ['#3a2a1e', '#111', '#6b4a2b', '#888', '#c9a35a'];
const SK = ['#d9a982', '#c48e64', '#f0c8a0', '#a8714a'];
const pick = a => a[Math.random() * a.length | 0];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

function decoy(maxShare) {
  const keys = shuffle(['hair', 'glas', 'beard', 'top']);
  const n = Math.random() < .6 ? maxShare : Math.random() * (maxShare + 1) | 0; // asla 4 ozelligin hepsi degil
  const p = {};
  keys.forEach((k, i) => p[k] = i < n ? TARGET[k] : pick(F[k].filter(v => v !== TARGET[k])));
  p.hc = pick(HC); p.skin = pick(SK);
  return p;
}

function curl(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

function drawPerson(p, x, y, s, t) {
  const hr = s * .2;
  ctx.save();
  // arka sac
  ctx.fillStyle = p.hc;
  if (p.hair === 'kivircik') {
    for (let i = 0; i <= 14; i++) { const a = Math.PI * (.85 + 1.3 * i / 14); curl(x + Math.cos(a) * hr * 1.08, y + Math.sin(a) * hr * 1.15, s * .075); }
    for (let k = 0; k < 4; k++) for (const sd of [-1, 1]) curl(x + sd * hr * (1.05 + .1 * (k % 2)), y + hr * .2 + k * s * .08, s * .07);
  } else if (p.hair === 'uzun') {
    ctx.fillRect(x - hr * 1.1, y - hr * .3, hr * 2.2, s * .42);
  }
  // govde
  const tops = { mavi: '#5a6aa8', takim: '#141414', gri: '#6e6e6e', yesil: '#2d5a2d' };
  ctx.fillStyle = tops[p.top];
  ctx.beginPath(); ctx.roundRect(x - s * .36, y + s * .3, s * .72, s * .55, [s * .16, s * .16, 0, 0]); ctx.fill();
  if (p.top === 'mavi') { ctx.fillStyle = '#3d3d44'; ctx.beginPath(); ctx.moveTo(x - s * .09, y + s * .3); ctx.lineTo(x + s * .09, y + s * .3); ctx.lineTo(x, y + s * .46); ctx.fill(); }
  if (p.top === 'takim') {
    ctx.fillStyle = '#eee'; ctx.beginPath(); ctx.moveTo(x - s * .1, y + s * .3); ctx.lineTo(x + s * .1, y + s * .3); ctx.lineTo(x, y + s * .55); ctx.fill();
    ctx.fillStyle = '#111'; ctx.fillRect(x - s * .02, y + s * .32, s * .04, s * .22);
  }
  // boyun + kafa
  ctx.fillStyle = p.skin;
  ctx.fillRect(x - hr * .4, y + hr * .8, hr * .8, s * .14);
  ctx.beginPath(); ctx.ellipse(x, y, hr, hr * 1.2, 0, 0, Math.PI * 2); ctx.fill();
  // on sac
  ctx.fillStyle = p.hc;
  if (p.hair === 'kivircik' || p.hair === 'kivircikKisa') {
    const r = p.hair === 'kivircik' ? s * .065 : s * .055;
    for (let i = 0; i <= 8; i++) { const a = Math.PI * (1.08 + .84 * i / 8); curl(x + Math.cos(a) * hr * .95, y + Math.sin(a) * hr * 1.05, r); }
  } else if (p.hair === 'duz' || p.hair === 'uzun') {
    ctx.beginPath(); ctx.ellipse(x, y - hr * .45, hr * 1.05, hr * .8, 0, Math.PI, 0); ctx.fill();
  } else if (p.hair === 'kel') {
    ctx.fillRect(x - hr * 1.02, y - hr * .1, hr * .2, hr * .5); ctx.fillRect(x + hr * .82, y - hr * .1, hr * .2, hr * .5);
  }
  // sakal
  const bc = p.target ? '#4a423b' : p.hc;
  ctx.fillStyle = bc;
  if (p.beard === 'tam') { ctx.beginPath(); ctx.ellipse(x, y + hr * .65, hr * .9, hr * .6, 0, 0, Math.PI); ctx.fill(); }
  if (p.beard === 'keci' || p.beard === 'biyik' || p.beard === 'tam') { ctx.beginPath(); ctx.ellipse(x, y + hr * .5, hr * .42, hr * .12, 0, 0, Math.PI * 2); ctx.fill(); }
  if (p.beard === 'keci') { ctx.beginPath(); ctx.ellipse(x, y + hr * .98, hr * .27, hr * .32, 0, 0, Math.PI * 2); ctx.fill(); }
  // gozler + agiz
  ctx.fillStyle = '#111';
  if (p.glas !== 'gunes') for (const sd of [-1, 1]) curl(x + sd * hr * .4, y - hr * .05, hr * .08);
  ctx.strokeStyle = '#5a2a2a'; ctx.lineWidth = Math.max(1, s * .015);
  ctx.beginPath(); ctx.arc(x, y + hr * .62, hr * .22, .2, Math.PI - .2); ctx.stroke();
  // gozluk
  if (p.glas !== 'yok') {
    const gw = hr * .52, gh = hr * .34;
    if (p.glas === 'yesil') {
      ctx.shadowColor = '#0f0'; ctx.shadowBlur = s * .25 * (.6 + .4 * Math.sin(t * 3 + x));
      ctx.fillStyle = 'rgba(0,255,80,.4)'; ctx.strokeStyle = '#3f3';
    } else if (p.glas === 'gunes') { ctx.fillStyle = '#050505'; ctx.strokeStyle = '#333'; }
    else { ctx.fillStyle = 'rgba(200,220,255,.15)'; ctx.strokeStyle = '#999'; }
    ctx.lineWidth = Math.max(1, s * .02);
    for (const sd of [-1, 1]) { ctx.beginPath(); ctx.roundRect(x + sd * hr * .4 - gw / 2, y - hr * .05 - gh / 2, gw, gh, gh * .25); ctx.fill(); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(x - hr * .14, y - hr * .08); ctx.lineTo(x + hr * .14, y - hr * .08); ctx.stroke();
  }
  ctx.restore();
  if (p.flash > 0) { ctx.fillStyle = `rgba(255,0,0,${p.flash})`; ctx.beginPath(); ctx.ellipse(x, y + s * .25, s * .42, s * .62, 0, 0, Math.PI * 2); ctx.fill(); }
}

// --- oyun ---
let level = 1, score = 0, timeLeft = 0, crowd = [], S = 50, speed = 0, toasts = [], foundT = 0, best = 0, area = {};
try { best = +localStorage.getItem('neoBest') || 0; } catch (e) {}

function levelParams() {
  return {
    n: Math.min(70, 10 + level * 7),
    share: level === 1 ? 1 : level === 2 ? 2 : 3,
    speed: level >= 3 ? Math.min(55, (level - 2) * 9) : 0,
    time: Math.max(12, 32 - level * 2),
  };
}

function startLevel() {
  const lp = levelParams();
  crowd = [{ ...TARGET }];
  for (let i = 1; i < lp.n; i++) crowd.push(decoy(lp.share));
  speed = lp.speed; timeLeft = lp.time;
  layout();
  state = 'play';
  toast('SEVİYE ' + level, '#9f9');
}

function layout() {
  area = { x: 10, y: 74, w: W - 20, h: H - 84 };
  const n = crowd.length;
  const nc = Math.max(2, Math.ceil(Math.sqrt(n * (area.w / area.h) * 1.4)));
  const nr = Math.ceil(n / nc);
  const cw = area.w / nc, chh = area.h / nr;
  S = Math.min(cw / .8, chh / 1.2) * .95;
  const cells = shuffle([...Array(nc * nr).keys()]);
  crowd.forEach((p, i) => {
    const c = cells[i];
    p.x = area.x + (c % nc + .5) * cw + (Math.random() - .5) * cw * .25;
    p.y = area.y + (c / nc | 0) * chh + S * .38 + (Math.random() - .5) * chh * .15;
    const a = Math.random() * Math.PI * 2;
    p.vx = Math.cos(a) * speed; p.vy = Math.sin(a) * speed; p.flash = 0;
  });
}

function toast(text, color) { toasts.push({ text, color, t: 1.6 }); }

function hit(p, x, y) { const dx = (x - p.x) / (S * .42), dy = (y - (p.y + S * .25)) / (S * .62); return dx * dx + dy * dy < 1; }

function tap(x, y) {
  if (state === 'menu') {
    if (inR(x, y, btns.red)) state = 'brief';
    else if (inR(x, y, btns.blue)) state = 'excel';
  } else if (state === 'excel') state = 'menu';
  else if (state === 'brief') { level = 1; score = 0; startLevel(); }
  else if (state === 'play') {
    const sorted = [...crowd].sort((a, b) => b.y - a.y); // ondeki once
    const p = sorted.find(q => hit(q, x, y));
    if (!p) return;
    if (p.target) {
      score += 100 * level + Math.ceil(timeLeft) * 10;
      state = 'found'; foundT = 1.8;
    } else {
      timeLeft -= 3; p.flash = .6;
      toast(p.glas === 'gunes' && p.top === 'takim' ? 'Ajan Smith! (-3 sn)' : 'SU53: Yetkiniz yok (-3 sn)', '#f55');
    }
  } else if (state === 'over') state = 'brief';
}

let btns = {};
const inR = (x, y, r) => r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

function text(t, x, y, size, color, align = 'center') {
  ctx.font = `bold ${size}px ${FONT}`; ctx.textAlign = align; ctx.fillStyle = color;
  ctx.shadowColor = color; ctx.shadowBlur = 8; ctx.fillText(t, x, y); ctx.shadowBlur = 0;
}
function pill(r, color, label) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, r.h / 2); ctx.fill();
  text(label, r.x + r.w / 2, r.y + r.h / 2 + 6, Math.min(18, W / 22), '#fff');
}

function draw(t) {
  ctx.drawImage(rain, 0, 0, W, H);
  const m = Math.min(W, H);
  if (state === 'menu') {
    text("NEO'YU BUL", W / 2, H * .28, Math.min(64, W / 7), '#3f3');
    text("Matrix'te kaybolan SAP'çiyi bul", W / 2, H * .28 + 40, Math.min(20, W / 24), '#9f9');
    const bw = Math.min(320, W * .8);
    btns.red = { x: W / 2 - bw / 2, y: H * .5, w: bw, h: 56 };
    btns.blue = { x: W / 2 - bw / 2, y: H * .5 + 76, w: bw, h: 56 };
    pill(btns.red, '#c0392b', 'Kırmızı hap: SAP (Başla)');
    pill(btns.blue, '#2e5cb8', 'Mavi hap: Excel');
    if (best) text('En iyi skor: ' + best, W / 2, H * .5 + 180, 18, '#9f9');
  } else if (state === 'excel') {
    text('Mavi hapı seçtin.', W / 2, H * .4, Math.min(30, W / 14), '#6af');
    text("Excel'de DÜŞEYARA yazarak", W / 2, H * .4 + 44, Math.min(20, W / 22), '#9cf');
    text('mutlu mesut yaşadın.', W / 2, H * .4 + 72, Math.min(20, W / 22), '#9cf');
    text('(geri dönmek için dokun)', W / 2, H * .4 + 120, 15, '#9f9');
  } else if (state === 'brief') {
    text('ARANAN', W / 2, H * .12, Math.min(44, W / 9), '#f44');
    drawPerson(TARGET, W / 2, H * .3, m * .42, t);
    const lines = ['• Uzun kıvırcık saç', '• Yeşil parlayan gözlük', '• Keçi sakal', '• Mavi kazak'];
    lines.forEach((l, i) => text(l, W / 2, H * .66 + i * 30, Math.min(20, W / 20), '#9f9'));
    text('Başlamak için dokun', W / 2, H * .66 + 150, 18, '#3f3');
  } else {
    // kalabalik
    [...crowd].sort((a, b) => a.y - b.y).forEach(p => drawPerson(p, p.x, p.y, S, t));
    if (level >= 4) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(.5, .15 + level * .04); ctx.drawImage(rain, 0, 0, W, H); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
    // ust bar
    ctx.fillStyle = 'rgba(0,0,0,.8)'; ctx.fillRect(0, 0, W, 66);
    drawPerson(TARGET, 34, 22, 38, t);
    const fs = Math.min(20, W / 20);
    text('SEVİYE ' + level, 70, 28, fs, '#3f3', 'left');
    text('SKOR ' + score, 70, 54, fs, '#9f9', 'left');
    text(Math.max(0, timeLeft).toFixed(1) + ' sn', W - 12, 40, fs * 1.3, timeLeft < 5 ? '#f44' : '#3f3', 'right');
    if (state === 'found' || state === 'over') {
      const tg = crowd[0];
      ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(0, 66, W, H);
      drawPerson(tg, tg.x, tg.y, S, t);
      ctx.strokeStyle = state === 'found' ? '#3f3' : '#f44'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(tg.x, tg.y + S * .2, S * (.7 + .1 * Math.sin(t * 8)), 0, Math.PI * 2); ctx.stroke();
      if (state === 'found') {
        text('BULUNDU!', W / 2, H * .45, Math.min(52, W / 8), '#3f3');
        text('Transport canlıya alındı ✓', W / 2, H * .45 + 40, Math.min(20, W / 22), '#9f9');
      } else {
        text('SİSTEM HATASI', W / 2, H * .42, Math.min(44, W / 10), '#f44');
        text('Kullanıcı bulunamadı (burada saklanıyordu)', W / 2, H * .42 + 36, Math.min(16, W / 28), '#f99');
        text('Skor: ' + score + '   En iyi: ' + best, W / 2, H * .42 + 70, 20, '#9f9');
        text('Tekrar için dokun', W / 2, H * .42 + 106, 18, '#3f3');
      }
    }
  }
  toasts.forEach((o, i) => text(o.text, W / 2, H * .2 + i * 30, Math.min(22, W / 20), o.color));
}

function update(dt) {
  toasts.forEach(o => o.t -= dt); toasts = toasts.filter(o => o.t > 0);
  crowd.forEach(p => { if (p.flash > 0) p.flash -= dt; });
  if (state === 'play') {
    timeLeft -= dt;
    for (const p of crowd) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.x < area.x + S * .4 || p.x > area.x + area.w - S * .4) p.vx *= -1;
      if (p.y < area.y + S * .38 || p.y > area.y + area.h - S * .85) p.vy *= -1;
    }
    if (timeLeft <= 0) {
      state = 'over';
      if (score > best) { best = score; try { localStorage.setItem('neoBest', best); } catch (e) {} }
    }
  } else if (state === 'found') {
    foundT -= dt;
    if (foundT <= 0) { level++; startLevel(); }
  }
}

function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  for (const c of [cv, rain]) { c.width = W * dpr; c.height = H * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); rc.setTransform(dpr, 0, 0, dpr, 0, 0);
  initRain();
  if (crowd.length) layout();
}

let last = 0;
function loop(ms) {
  const t = ms / 1000, dt = Math.min(.05, t - last || 0); last = t;
  stepRain(.35 + (state === 'play' ? level * .03 : 0));
  update(dt); draw(t);
  requestAnimationFrame(loop);
}
cv.addEventListener('pointerdown', e => tap(e.clientX, e.clientY));
addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
